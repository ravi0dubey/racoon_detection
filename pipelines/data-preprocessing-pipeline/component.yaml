name: Video Frame Extractor
description: Extracts frames from videos using a custom Docker image.
inputs:
- name: input_source
  type: String
- name: output_path
  type: String
- name: frame_rate
  type: Integer
  default: 1
implementation:
  container:
    image: us-central1-docker.pkg.dev/racoon-detection-427421/video-frame-extractor-repo/video-frame-extractor:latest
    command:
    - python
    - rd_video_image_extractor.py
    args:
    - --input_source
    - {inputValue: input_source}
    - --output_path
    - {inputValue: output_path}
    - --frame_rate
    - {inputValue: frame_rate}
